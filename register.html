<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlogSpace | Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<header class="navbar">
  <a class="brand" href="index.html">Blog<span>Space</span></a>
  <a class="text-link" href="index.html">← Home</a>
</header>

<main class="auth-wrap">
  <form class="auth-card" id="registerForm">
    <p class="eyebrow">JOIN BLOGSPACE</p>
    <h1>Create account</h1>
    <p class="muted">Start publishing your ideas today.</p>

    <label>Full name
      <input type="text" id="registerName" required placeholder="Your name">
    </label>

    <label>Email
      <input type="email" id="registerEmail" required placeholder="you@example.com">
    </label>

    <label>Password
      <input type="password" id="registerPassword" required minlength="6" placeholder="Minimum 6 characters">
    </label>

    <label>Confirm password
      <input type="password" id="registerConfirm" required minlength="6" placeholder="Repeat password">
    </label>

    <button class="btn primary full" type="submit">Register</button>

    <p class="form-note">Already have an account? <a href="login.html">Login</a></p>
  </form>
</main>

<script src="js/script.js"></script>
</body>
</html>
