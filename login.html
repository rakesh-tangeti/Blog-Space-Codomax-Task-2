<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlogSpace | Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<header class="navbar">
  <a class="brand" href="index.html">Blog<span>Space</span></a>
  <a class="text-link" href="index.html">← Home</a>
</header>

<main class="auth-wrap">
  <form class="auth-card" id="loginForm">
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Login</h1>
    <p class="muted">Continue writing and sharing your ideas.</p>

    <label>Email
      <input type="email" id="loginEmail" required placeholder="you@example.com">
    </label>

    <label>Password
      <input type="password" id="loginPassword" required placeholder="Your password">
    </label>

    <button class="btn primary full" type="submit">Login</button>

    <p class="form-note">Don't have an account? <a href="register.html">Register</a></p>
  </form>
</main>

<script src="js/script.js"></script>
</body>
</html>
